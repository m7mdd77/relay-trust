<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Relay Trust: identity to claims to verification to policy</title><desc id="desc">Scout signs a request bound to an owner grant and evidence lab history. Steward verifies signatures, validity, audience, scope and live revocation before an atomic quota check and synthetic effect.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#648068"/></marker><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#183332}.label{font-size:12px;letter-spacing:1px;fill:#526764}.body{font-size:15px;fill:#526764}.head{font-size:21px;font-weight:600}.box{fill:#fffdf7;stroke:#cbd6c5;stroke-width:1.5}.line{stroke:#648068;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1280" height="720" fill="#f3f5f0"/>
<text x="48" y="52" class="label">RELAY TRUST / LOCAL CRYPTOGRAPHIC LABORATORY</text><text x="48" y="104" font-size="38" font-weight="600">Identity → claims → verification → policy</text>
<rect x="48" y="155" width="300" height="110" rx="14" class="box"/><text x="70" y="190" class="head">Workshop Owner</text><text x="70" y="218" class="body">Pinned issuer · Ed25519</text><text x="70" y="242" class="body">ticket.create · SITE-17 · quota · expiry</text>
<rect x="48" y="292" width="300" height="110" rx="14" class="box"/><text x="70" y="327" class="head">Evidence Lab</text><text x="70" y="355" class="body">Pinned issuer · Ed25519</text><text x="70" y="379" class="body">Attestation + 3 signed inspection receipts</text>
<rect x="48" y="429" width="300" height="110" rx="14" class="box"/><text x="70" y="464" class="head">Scout / requester</text><text x="70" y="492" class="body">Distinct key-bound identity</text><text x="70" y="516" class="body">Signed request + exact credential hashes</text>
<path d="M348 210H385V323H430" class="line"/><path d="M348 347H430" class="line"/><path d="M348 484H385V372H430" class="line"/>
<rect x="430" y="210" width="342" height="295" rx="17" fill="#183332"/><text x="455" y="247" font-size="22" font-weight="600" style="fill:#c4edb9">Patch Steward / verifier</text><text x="455" y="282" font-size="16" style="fill:#e4efe0">Proof of requester key possession</text><text x="455" y="311" font-size="16" style="fill:#e4efe0">Pinned issuer / subject / audience</text><text x="455" y="340" font-size="16" style="fill:#e4efe0">Exact envelopes + validity windows</text><text x="455" y="369" font-size="16" style="fill:#e4efe0">Live revocation + signed history</text><text x="455" y="412" font-size="17" font-weight="600" style="fill:#c4edb9">D1 revision-guarded commit</text><text x="455" y="442" font-size="15" style="fill:#e4efe0">Recheck trust + quota after any conflict</text><text x="455" y="473" font-size="15" style="fill:#e4efe0">Commit at most one effect per request</text>
<rect x="441" y="544" width="320" height="70" rx="12" class="box"/><text x="462" y="574" class="head">Live revocation registry</text><text x="462" y="597" class="body">Narrow / renew revokes the previous grant</text><path d="M601 544V506" class="line"/>
<path d="M772 310H814V247H854" class="line"/><path d="M772 404H814V448H854" class="line"/>
<rect x="854" y="179" width="376" height="162" rx="14" fill="#e4efd9" stroke="#c0d5b4"/><text x="878" y="216" class="head">Accept → signed receipt</text><text x="878" y="249" class="body">One synthetic repair draft in your sandbox</text><text x="878" y="278" class="body">Steward signs the attributable effect</text><text x="878" y="307" class="body">Replay returns original receipt; no new effect</text>
<rect x="854" y="376" width="376" height="153" rx="14" fill="#faeee9" stroke="#e5ccc4"/><text x="878" y="413" class="head">Refuse → explain why</text><text x="878" y="447" class="body">Spoofed key · tampered grant · wrong scope</text><text x="878" y="476" class="body">Expired request · revoked authority · quota</text><text x="878" y="505" class="body">No synthetic effect committed</text>
<text x="48" y="665" class="body">Real signatures. Synthetic actors and effects. One process. Local signed format; no VC/DID compliance claim.</text>
</svg>
